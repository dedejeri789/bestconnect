            0% { width: 0%; }
            100% { width: 100%; }
        }

        #main-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1b5e20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
            z-index: 88888;
        }

        .hero-top {
            width: 100%;
            height: 55%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-top img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .hero-bottom {
            width: 100%;
            height: 45%;
            background-color: #ffffff;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.1);
        }

        .hero-bottom h2 {
            color: #1b5e20;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hero-bottom p {
            color: #555555;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
            max-width: 350px;
        }

        .btn-start {
            background-color: #1b5e20;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(27, 94, 32, 0.3);
            transition: background 0.3s, transform 0.2s;
            text-decoration: none;
        }

        .btn-start:hover {
            background-color: #2e7d32;
            transform: scale(1.05);
        }

        /* Tombol Install PWA (muncul otomatis bila browser mendukung) */
        .btn-install {
            display: none;
            margin-top: 12px;
            background: transparent;
            color: #1b5e20;
            border: 2px solid #1b5e20;
            padding: 8px 28px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
        }

        .ios-hint {
            display: none;
            margin-top: 12px;
            font-size: 12px;
            color: #1b5e20;
            max-width: 300px;
            line-height: 1.4;
        }

        #app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 9999999;
            display: none;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #app-container iframe {
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: none;
            outline: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L1 7l11 5 9-4.09V17h2V7L12 2zM3.18 12.82L12 17l8.82-4.18V20H3.18v-7.18z"/>
                </svg>
            </div>
            <h1>SDIT AL UKHUWAH</h1>
            <div class="loader-subtitle">Memuat Portal Layanan Digital...</div>
            <div class="loader-progress">
                <div class="loader-bar"></div>
            </div>
        </div>
    </div>

    <div id="main-container">
        <div class="hero-top">
            <img src="https://lh3.googleusercontent.com/d/1hbPmQY5Mb4sIF-GPWTowMQJSy3E9Uci_" alt="Ilustrasi Sekolah SDIT Al Ukhuwah" onerror="this.src='https://images.unsplash.com/photo-1588072432836-e10032774350?auto=format&fit=crop&w=600&q=80'">
        </div>
        <div class="hero-bottom">
            <h2>SDIT AL UKHUWAH</h2>
            <p>Selamat datang di portal layanan digital sekolah. Sistem terintegrasi untuk memudahkan aktivitas akademik.</p>
            <button id="loginButton" class="btn-start">Get Started</button>
            <button id="installButton" class="btn-install">Pasang Aplikasi</button>
            <div id="iosHint" class="ios-hint">Untuk memasang di iPhone: ketuk tombol Bagikan, lalu pilih "Tambah ke Layar Utama".</div>
        </div>
    </div>

    <div id="app-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbyPzu9rKqIpZTVLhKJvRiB7DJCN4tO3KlNmn2pknpKJKHvZui9JNUbnp7oTAVeIexCt/exec" 
            allow="autoplay; encrypted-media; camera; microphone; fullscreen" 
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        // ===== Service Worker (wajib untuk PWA) =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function(err) {
                    console.log('Service worker gagal didaftarkan:', err);
                });
            });
        }

        // ===== Tombol "Pasang Aplikasi" =====
        let deferredPrompt = null;
        const installButton = document.getElementById('installButton');
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            if (!isStandalone) installButton.style.display = 'inline-block';
        });

        installButton.addEventListener('click', async function() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            installButton.style.display = 'none';
        });

        window.addEventListener('appinstalled', function() {
            installButton.style.display = 'none';
        });

        // Petunjuk khusus iOS (Safari tidak punya prompt otomatis)
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        if (isIOS && !isStandalone) {
            document.getElementById('iosHint').style.display = 'block';
        }

        // ===== Splash -> Welcome =====
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loading-screen');
                const mainContainer = document.getElementById('main-container');

                loadingScreen.style.opacity = '0';
                loadingScreen.style.visibility = 'hidden';

                mainContainer.style.visibility = 'visible';
                mainContainer.style.opacity = '1';
            }, 1500); 
        });

        const loginButton = document.getElementById('loginButton');
        const mainContainer = document.getElementById('main-container');
        const appContainer = document.getElementById('app-container');

        loginButton.addEventListener('click', function() {
            // Fullscreen hanya dicoba bila belum berjalan sebagai aplikasi terpasang
            if (!isStandalone) {
                let elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => {
                        console.log("Fullscreen dibatasi browser:", err);
                    });
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            }

            mainContainer.style.display = 'none';
            appContainer.style.display = 'block';
        });

        // Solusi keyboard HP menutupi kolom input di dalam iframe
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', function() {
                if (appContainer.style.display === 'block') {
                    appContainer.style.height = window.visualViewport.height + 'px';
                    window.scrollTo(0, 0);
                }
            });
        }
    </script>
</body>
</html>
